plugins {
    id 'com.android.application'
}

def signingVariables = ['KEYSTORE_FILE', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
def hasReleaseSigning = signingVariables.every { System.getenv(it)?.trim() }

android {
    namespace 'com.example.practice4'
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.example.practice4'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
    }
}

// Debug and lint do not need secrets. Any release packaging task does.
tasks.register('validateReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Signed release requires KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.')
        }
        if (!file(System.getenv('KEYSTORE_FILE')).isFile()) {
            throw new GradleException('KEYSTORE_FILE does not point to an existing keystore.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn tasks.named('validateReleaseSigning')
    }
}
